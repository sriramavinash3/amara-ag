name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/pages/BlogAdmin.jsx src/utils/blogApi.js functions
      - run: npx vitest run tests/blog-cms-production.test.mjs tests/blog-cms-validation.test.mjs
      - run: npm run build
